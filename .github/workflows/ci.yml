name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 타입 · 린트 · 빌드
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      - name: 콘텐츠 빌드
        run: pnpm content

      - name: 타입 체크
        run: pnpm typecheck

      - name: 린트
        run: pnpm lint

      - name: 프로덕션 빌드
        run: pnpm build

      # DESIGN.md §13.2 — 에디터가 프로덕션에 유출되면 누구나 글을 쓸 수 있다.
      # 404로 막는 것과 달리, 여기서는 코드 자체가 빌드에 없어야 한다.
      - name: 에디터가 프로덕션 빌드에 없는지 확인
        run: |
          manifest=.next/server/app-paths-manifest.json
          if [ ! -f "$manifest" ]; then
            echo "::error::$manifest 를 찾을 수 없습니다"
            exit 1
          fi

          if grep -qE '"/(write|api/draft)' "$manifest"; then
            echo "::error::에디터 라우트가 프로덕션 빌드에 포함되었습니다"
            grep -oE '"/[^"]*(write|draft)[^"]*"' "$manifest"
            exit 1
          fi

          if grep -rlq "prosemirror" .next/static/chunks 2>/dev/null; then
            echo "::error::에디터 라이브러리가 클라이언트 번들에 포함되었습니다"
            grep -rl "prosemirror" .next/static/chunks
            exit 1
          fi

          echo "OK — 에디터 라우트·번들 모두 없음"
