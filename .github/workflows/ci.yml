name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 타입 · 린트 · 빌드
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      - name: 콘텐츠 빌드
        run: pnpm content

      - name: 타입 체크
        run: pnpm typecheck

      - name: 린트
        run: pnpm lint

      - name: 프로덕션 빌드
        run: pnpm build

      # /write 와 /admin 은 이제 프로덕션에도 존재한다.
      # 예전에는 빌드에서 통째로 빠져 있어서 인증 버그가 나도 아무 일이 없었지만,
      # 지금은 미들웨어가 유일한 방어선이다. 그 방어선이 걷혔는지 검사한다.
      - name: 보호 라우트에 인증이 걸려 있는지 확인
        run: |
          mw=src/middleware.ts
          if [ ! -f "$mw" ]; then
            echo "::error::$mw 가 없습니다. /write 와 /admin 이 무방비로 열립니다."
            exit 1
          fi
          for route in "/write" "/admin" "/api/draft" "/api/admin"; do
            if ! grep -q "'$route" "$mw"; then
              echo "::error::미들웨어 matcher에 $route 가 없습니다"
              exit 1
            fi
          done
          for f in src/app/api/draft/route.ts src/app/api/admin/route.ts; do
            if ! grep -q "requireOwner" "$f"; then
              echo "::error::$f 에 소유자 확인이 없습니다"
              exit 1
            fi
          done
          echo "OK — 보호 라우트 4개 모두 미들웨어 + 핸들러 이중 확인"

      # 공개 페이지가 실수로 동적 렌더링이 되면 정적 생성이 통째로 무너진다.
      # 서버 컴포넌트에서 cookies()/headers() 를 읽는 순간 일어난다.
      - name: 공개 페이지가 정적으로 유지되는지 확인
        run: |
          manifest=.next/server/app-paths-manifest.json
          for route in "/page" "/posts/page" "/categories/page" "/about/page"; do
            if ! grep -q "\"$route\"" "$manifest"; then
              echo "::error::$route 를 찾을 수 없습니다"
              exit 1
            fi
          done
          if [ ! -f .next/server/app/index.html ] && [ ! -f .next/server/app/page.html ]; then
            echo "::error::홈이 정적으로 생성되지 않았습니다 (동적 렌더링으로 떨어짐)"
            ls .next/server/app | head -20
            exit 1
          fi
          echo "OK — 공개 페이지 정적 생성 유지"
