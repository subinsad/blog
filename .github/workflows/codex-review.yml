name: Codex pull request review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# A new push supersedes the review that is still running for the old head.
concurrency:
  group: codex-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    # Fork pull requests do not receive repository secrets, so the reviewer cannot run there.
    # Drafts are skipped until they are marked ready.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false
    permissions:
      contents: read
    outputs:
      final_message: ${{ steps.codex.outputs.final-message }}
    env:
      # 시크릿이 없으면 리뷰를 건너뛴다. 매 PR마다 빨간 체크가 뜨면
      # CI 자체를 안 보게 되므로, 미설정은 실패가 아니라 skip이어야 한다.
      HAS_KEY: ${{ secrets.OPENAI_API_KEY != '' }}
    steps:
      - name: 시크릿 미설정 시 안내
        if: env.HAS_KEY != 'true'
        run: |
          echo "::notice::OPENAI_API_KEY 가 없어 Codex 리뷰를 건너뜁니다."
          echo "설정 방법은 .github/codex/README.md 참고"

      - name: Check out pull request merge commit
        if: env.HAS_KEY == 'true'
        uses: actions/checkout@v5
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 0
          persist-credentials: false

      - name: Run Codex reviewer
        id: codex
        if: env.HAS_KEY == 'true'
        uses: openai/codex-action@v1
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .github/codex/prompts/review.md
          sandbox: read-only
          safety-strategy: drop-sudo

  post-feedback:
    runs-on: ubuntu-latest
    needs: review
    if: needs.review.outputs.final_message != ''
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Post or update the Codex review comment
        uses: actions/github-script@v7
        env:
          CODEX_FINAL_MESSAGE: ${{ needs.review.outputs.final_message }}
        with:
          github-token: ${{ secrets.CODEX_GITHUB_TOKEN }}
          script: |
            // A stable marker so every re-review edits one comment instead of piling up.
            const marker = '<!-- codex-review -->';
            const body = [
              marker,
              '## Codex review',
              '',
              process.env.CODEX_FINAL_MESSAGE,
              '',
              `<sub>커밋 \`${context.payload.pull_request.head.sha.slice(0, 7)}\` 기준 · 읽기 전용 리뷰</sub>`,
            ].join('\n');

            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.startsWith(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                body,
              });
            }
