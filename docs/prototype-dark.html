<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>subbi.log — 디자인 프로토타입</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#FFFFFF; --bg-subtle:#F8F9FA; --bg-elevated:#FFFFFF; --bg-hover:#F1F3F5;
  --fg:#212529; --fg-body:#495057; --fg-muted:#868E96; --fg-subtle:#ADB5BD;
  --border:#E9ECEF; --border-strong:#DEE2E6;
  --accent:#4263EB; --accent-hover:#3B5BDB; --accent-subtle:#EDF2FF;
  --code-bg:#F8F9FA;
  --c-fe:#1971C2; --c-be:#2F9E44; --c-do:#E8590C; --c-cs:#6741D9; --c-rt:#C2255C;
  --font-sans:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,monospace;
  --ease:cubic-bezier(.2,0,0,1);
  --container:1280px; --gutter:40px; --sb-w:256px; --sb-gap:56px;
}
[data-theme="dark"] {
  --bg:#141517; --bg-subtle:#1A1B1E; --bg-elevated:#25262B; --bg-hover:#2C2E33;
  --fg:#E9ECEF; --fg-body:#C1C2C5; --fg-muted:#909296; --fg-subtle:#5C5F66;
  --border:#2C2E33; --border-strong:#373A40;
  --accent:#748FFC; --accent-hover:#91A7FF; --accent-subtle:#1E2338;
  --code-bg:#1A1B1E;
  --c-fe:#74C0FC; --c-be:#8CE99A; --c-do:#FFC078; --c-cs:#B197FC; --c-rt:#FAA2C1;
}
* { box-sizing:border-box; margin:0; padding:0; }
body { background:var(--bg); color:var(--fg-body); font-family:var(--font-sans);
  font-size:15px; line-height:1.6; -webkit-font-smoothing:antialiased;
  word-break:keep-all; overflow-wrap:break-word;
  transition:background .2s var(--ease), color .2s var(--ease); }
a { color:inherit; text-decoration:none; }
button { font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; }
:focus-visible { outline:2px solid var(--accent); outline-offset:2px; border-radius:4px; }
.skip { position:absolute; top:-9999px; left:16px; z-index:100;
  background:var(--accent); color:#fff; padding:8px 14px; border-radius:8px; font-size:14px; }
.skip:focus { top:12px; }

/* ── header ── */
.hd { position:sticky; top:0; z-index:50; height:64px;
  background:color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter:saturate(180%) blur(12px); border-bottom:1px solid var(--border); }
.hd-in { max-width:var(--container); margin:0 auto; padding:0 var(--gutter); height:100%;
  display:flex; align-items:center; justify-content:space-between; }
.wm { font-family:var(--font-mono); font-size:17px; font-weight:500;
  letter-spacing:-.02em; color:var(--fg); }
.wm span { color:var(--accent); }
.hd-r { display:flex; align-items:center; gap:8px; }
.srch { display:flex; align-items:center; gap:8px; height:34px; padding:0 12px;
  background:var(--bg-subtle); border:1px solid var(--border); border-radius:8px;
  color:var(--fg-subtle); font-size:13px; min-width:200px;
  transition:border-color .15s var(--ease); }
.srch:hover { border-color:var(--border-strong); }
.srch kbd { margin-left:auto; font-family:var(--font-mono); font-size:11px;
  color:var(--fg-subtle); border:1px solid var(--border-strong);
  border-radius:4px; padding:1px 5px; }
.btn-write { display:inline-flex; align-items:center; gap:6px; height:34px; padding:0 14px;
  border-radius:8px; background:var(--accent); color:#fff; font-size:13px; font-weight:500;
  transition:background .15s var(--ease); }
.btn-write:hover { background:var(--accent-hover); }
.icb { width:34px; height:34px; border-radius:8px; display:grid; place-items:center;
  color:var(--fg-muted); transition:background .15s var(--ease), color .15s var(--ease); }
.icb:hover { background:var(--bg-hover); color:var(--fg-body); }

/* ── layout ── */
.wrap { max-width:var(--container); margin:0 auto; padding:0 var(--gutter);
  display:grid; grid-template-columns:var(--sb-w) minmax(0,1fr); gap:var(--sb-gap); }
.sb { position:sticky; top:88px; align-self:start; padding-top:24px; }
.main { padding:24px 0 96px; }

/* ── sidebar ── */
.sb-i { display:flex; align-items:center; justify-content:space-between; position:relative;
  height:40px; padding:0 14px; border-radius:8px; margin-bottom:4px;
  font-size:13px; color:var(--fg-body);
  transition:background .15s var(--ease), color .15s var(--ease); }
.sb-i:hover { background:var(--bg-hover); }
.sb-i.on { background:var(--accent-subtle); color:var(--accent); }
.sb-i.on::before { content:""; position:absolute; left:0; top:10px; bottom:10px;
  width:2px; background:var(--accent); }
.sb-i b { font-weight:400; font-size:12px; color:var(--fg-subtle);
  font-variant-numeric:tabular-nums; }
.sb-i.on b { color:var(--accent); }
.sb-div { border-top:1px solid var(--border); margin:28px 0 20px; }
.sb-gl { font-size:11px; font-weight:500; color:var(--fg-subtle);
  padding:0 14px 10px; letter-spacing:.02em; }

/* ── title row + viewtoggle ── */
.ttl-row { display:flex; align-items:flex-end; justify-content:space-between;
  border-bottom:1px solid var(--border); padding-bottom:10px; margin-bottom:28px; }
.ttl { font-size:20px; font-weight:700; color:var(--fg); letter-spacing:-.015em; }
.ttl em { font-style:normal; font-weight:400; font-size:14px;
  color:var(--fg-muted); margin-left:8px; font-variant-numeric:tabular-nums; }
.vt { display:flex; gap:4px; }
.vt button { width:32px; height:32px; display:grid; place-items:center; position:relative;
  color:var(--fg-subtle); border-radius:6px; transition:color .15s var(--ease); }
.vt button:hover { color:var(--fg-body); }
.vt button[aria-pressed="true"] { color:var(--accent); }
.vt button[aria-pressed="true"]::after { content:""; position:absolute;
  left:7px; right:7px; bottom:-11px; height:2px; background:var(--accent); }

/* ── card view ── */
.grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:24px; }
.card { border:1px solid var(--border); border-radius:12px; overflow:hidden;
  background:var(--bg); display:flex; flex-direction:column;
  transition:transform .2s var(--ease), border-color .2s var(--ease); }
.card:hover { transform:translateY(-2px); border-color:var(--border-strong); }
.card-th { aspect-ratio:16/9; overflow:hidden; position:relative; display:grid; place-items:center; }
.card-th b { font-size:22px; font-weight:700; opacity:.15; letter-spacing:-.02em; }
.card-bd { padding:20px; display:flex; flex-direction:column; flex:1; }
.card-t { font-size:17px; font-weight:600; line-height:1.45; color:var(--fg);
  margin:8px 0 6px; letter-spacing:-.01em;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.card:hover .card-t { color:var(--accent); }
.card-s { font-size:14px; line-height:1.6; color:var(--fg-muted);
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.card-f { margin-top:12px; padding-top:12px; display:flex; align-items:center;
  justify-content:space-between; gap:8px; }
.card-m { font-size:13px; color:var(--fg-subtle); font-variant-numeric:tabular-nums; white-space:nowrap; }
.tags { display:flex; gap:6px; flex-wrap:wrap; }
.tag { font-size:13px; height:24px; padding:0 10px; border-radius:999px;
  background:var(--bg-subtle); color:var(--fg-muted); display:inline-flex; align-items:center;
  transition:background .15s var(--ease), color .15s var(--ease); }
.tag:hover { background:var(--accent-subtle); color:var(--accent); }
.bdg { display:inline-flex; align-items:center; height:20px; padding:0 8px;
  border-radius:4px; font-size:12px; font-weight:500; }
.card-bd > .bdg { align-self:flex-start; }

/* ── list view ── */
.list { border-top:1px solid var(--border); }
.row { display:grid; grid-template-columns:92px minmax(0,1fr) 96px 116px 52px;
  gap:16px; align-items:center; height:52px; padding:0 8px; position:relative;
  border-bottom:1px solid var(--border);
  transition:background .15s var(--ease); }
.row > * { align-self:center; }
.row > .bdg, .row > .tags { justify-self:start; }
.row > .tags { align-items:center; flex-wrap:nowrap; }
.row > .row-r { justify-self:end; }
.row:hover { background:var(--bg-hover); }
.row:hover::before { content:""; position:absolute; left:0; top:0; bottom:0;
  width:2px; background:var(--accent); }
.row-d { font-size:13px; color:var(--fg-muted); font-variant-numeric:tabular-nums; }
.row-t { font-size:15px; font-weight:600; color:var(--fg); letter-spacing:-.01em;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.row:hover .row-t { color:var(--accent); }
.row-r { font-size:13px; color:var(--fg-subtle); text-align:right;
  font-variant-numeric:tabular-nums; }

/* ── category view ── */
.sec { margin-bottom:40px; }
.sec-h { display:flex; align-items:center; gap:10px;
  border-bottom:1px solid var(--border-strong); padding-bottom:10px; margin-bottom:4px; }
.sec-d { width:8px; height:8px; border-radius:50%; }
.sec-n { font-size:20px; font-weight:700; color:var(--fg); letter-spacing:-.015em; }
.sec-c { font-size:13px; color:var(--fg-muted); margin-left:auto;
  font-variant-numeric:tabular-nums; }
.sec-more { display:block; text-align:right; font-size:13px; color:var(--accent);
  padding-top:14px; }
.sec-more:hover { color:var(--accent-hover); }

/* ── footer ── */
.ft { border-top:1px solid var(--border); padding:32px 0; margin-top:24px;
  font-size:13px; color:var(--fg-subtle); display:flex; justify-content:space-between; }
.ft a:hover { color:var(--accent); }

@media (max-width:1359px) {
  :root { --gutter:32px; --sb-w:240px; --sb-gap:40px; }
}
@media (max-width:1120px) {
  .grid { grid-template-columns:repeat(2,minmax(0,1fr)); }
}
@media (max-width:1024px) {
  .wrap { grid-template-columns:minmax(0,1fr); gap:0; }
  .sb { position:static; padding-top:20px; }
  .sb nav { display:flex; gap:8px; overflow-x:auto; padding-bottom:6px;
    scrollbar-width:none; }
  .sb nav::-webkit-scrollbar { display:none; }
  .sb-i { flex:0 0 auto; height:34px; gap:8px; margin-bottom:0; border-radius:999px;
    border:1px solid var(--border); }
  .sb-i.on { border-color:transparent; }
  .sb-i.on::before { display:none; }
  .sb-div, .sb-gl { display:none; }
  .main { padding-top:20px; }
  .row { grid-template-columns:92px minmax(0,1fr) 96px 52px; }
  .row > .tags { display:none; }
}
@media (max-width:768px) {
  :root { --gutter:20px; }
  .grid { grid-template-columns:minmax(0,1fr); }
  .row { grid-template-columns:76px minmax(0,1fr) 96px; gap:12px; }
  .row > .row-r { display:none; }
  .srch { min-width:0; }
  .srch .srch-l { display:none; }
  .btn-write { padding:0; width:34px; justify-content:center; }
  .btn-write span { display:none; }
  .ttl-row { align-items:center; }
}
@media (max-width:480px) {
  .row { grid-template-columns:70px minmax(0,1fr); }
  .row > .bdg { display:none; }
}
</style>
</head>
<body>
<a href="#main" class="skip">본문으로 건너뛰기</a>

<header class="hd">
  <div class="hd-in">
    <a href="#" class="wm">subbi<span>.log</span></a>
    <div class="hd-r">
      <div class="srch" role="button" tabindex="0">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <span class="srch-l">검색</span><kbd>⌘K</kbd>
      </div>
      <a href="prototype-write.html" class="btn-write" title="dev 모드에서만 노출">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        <span>글쓰기</span>
      </a>
      <button class="icb" id="theme" aria-label="테마 전환" title="테마 전환">
        <svg id="ico-sun" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4 1.4"/></svg>
        <svg id="ico-moon" style="display:none" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
      </button>
    </div>
  </div>
</header>

<div class="wrap">
  <aside class="sb"><nav id="sb" aria-label="카테고리"></nav></aside>
  <main class="main" id="main">
    <div class="ttl-row">
      <h1 class="ttl">전체 글<em id="cnt">42</em></h1>
      <div class="vt" role="group" aria-label="보기 방식">
        <button data-v="card" aria-pressed="true" aria-label="카드 보기" title="카드 보기">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></svg></button>
        <button data-v="list" aria-pressed="false" aria-label="목록 보기" title="목록 보기">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg></button>
        <button data-v="cat" aria-pressed="false" aria-label="카테고리 보기" title="카테고리 보기">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/><path d="M14 4h7M14 9h7M14 15h7M14 20h7"/></svg></button>
      </div>
    </div>
    <div id="view" aria-live="polite"></div>
    <footer class="ft">
      <span>© 2026 subbi.log</span>
      <span><a href="#">RSS</a> · <a href="#">GitHub</a> · <a href="#">About</a></span>
    </footer>
  </main>
</div>

<script>
const CATS = {
  fe:{ n:'Frontend', v:'--c-fe', cnt:18 }, be:{ n:'Backend', v:'--c-be', cnt:9 },
  do:{ n:'DevOps', v:'--c-do', cnt:6 }, cs:{ n:'CS · 기초', v:'--c-cs', cnt:4 },
  rt:{ n:'회고 · 생각', v:'--c-rt', cnt:5 }
};
const POSTS = [
  { t:'Next.js App Router에서 MDX 파이프라인 만들기', s:'contentlayer가 멈춘 뒤 velite로 옮기며 정리한 빌드타임 타입 안전 파이프라인', c:'fe', d:'08.25', r:'8분', g:['Next.js','MDX'] },
  { t:'리액트 렌더링 최적화, 어디까지 해야 할까', s:'memo를 붙이기 전에 먼저 확인해야 할 세 가지를 프로파일러로 짚어봤다', c:'fe', d:'08.20', r:'5분', g:['React','성능'] },
  { t:'Docker 멀티스테이지 빌드로 이미지 70% 줄이기', s:'레이어 캐시 동작을 이해하고 나니 빌드 시간도 절반이 됐다', c:'do', d:'08.14', r:'3분', g:['Docker'] },
  { t:'Postgres 인덱스가 안 타는 이유', s:'EXPLAIN ANALYZE를 읽는 법부터 시작해 실제로 겪은 다섯 가지 케이스', c:'be', d:'08.09', r:'6분', g:['Postgres','SQL'] },
  { t:'해시 테이블을 직접 구현해보며 배운 것', s:'체이닝과 오픈 어드레싱을 둘 다 만들어 벤치마크를 돌려봤다', c:'cs', d:'08.02', r:'9분', g:['자료구조'] },
  { t:'6개월 만에 블로그를 다시 시작하며', s:'왜 쓰지 않게 됐는지를 먼저 정리하고, 이번엔 뭘 다르게 할지 적었다', c:'rt', d:'07.28', r:'4분', g:['회고'] },
  { t:'Zustand vs Jotai, 실전에서 갈린 지점', s:'같은 화면을 두 번 만들어보고 나서야 선택 기준이 명확해졌다', c:'fe', d:'07.21', r:'7분', g:['React','상태관리'] },
  { t:'GitHub Actions 캐시로 CI 4분 단축하기', s:'pnpm store와 Next.js 빌드 캐시를 어디에 어떻게 걸어야 하는지', c:'do', d:'07.15', r:'4분', g:['CI'] },
  { t:'트랜잭션 격리 수준을 눈으로 확인해봤다', s:'psql 두 개를 띄워놓고 팬텀 리드가 실제로 발생하는 순간을 재현했다', c:'be', d:'07.08', r:'11분', g:['Postgres'] }
];

const esc = x => { const d = document.createElement('div'); d.textContent = x; return d.innerHTML; };
const tint = (k, p) => `color-mix(in srgb, var(${CATS[k].v}) ${p}%, transparent)`;
const badge = k => `<span class="bdg" style="background:${tint(k,12)};color:var(${CATS[k].v})">${esc(CATS[k].n)}</span>`;

document.getElementById('sb').innerHTML =
  `<a href="#" class="sb-i on">전체 글<b>42</b></a>` +
  Object.keys(CATS).map(k => `<a href="#" class="sb-i">${esc(CATS[k].n)}<b>${CATS[k].cnt}</b></a>`).join('') +
  `<div class="sb-div"></div><div class="sb-gl">시리즈</div>` +
  `<a href="#" class="sb-i">Next.js 블로그 만들기<b>3/7</b></a>` +
  `<a href="#" class="sb-i">리액트 톺아보기<b>5/5</b></a>`;

function render(view) {
  const el = document.getElementById('view');
  let h = '';
  if (view === 'card') {
    h = `<div class="grid">` + POSTS.map(p => `
      <article class="card">
        <div class="card-th" style="background:linear-gradient(135deg, ${tint(p.c,26)}, ${tint(p.c,8)})">
          <b style="color:var(${CATS[p.c].v})">${esc(CATS[p.c].n)}</b>
        </div>
        <div class="card-bd">
          ${badge(p.c)}
          <h2 class="card-t">${esc(p.t)}</h2>
          <p class="card-s">${esc(p.s)}</p>
          <div class="card-f">
            <div class="tags">${p.g.map(g => `<span class="tag">#${esc(g)}</span>`).join('')}</div>
            <span class="card-m">${p.d} · ${p.r}</span>
          </div>
        </div>
      </article>`).join('') + `</div>`;
  } else if (view === 'list') {
    h = `<div class="list">` + POSTS.map(p => `
      <a href="#" class="row">
        <span class="row-d">2026.${p.d}</span>
        <span class="row-t">${esc(p.t)}</span>
        ${badge(p.c)}
        <span class="tags">${p.g.slice(0,1).map(g => `<span class="tag">#${esc(g)}</span>`).join('')}</span>
        <span class="row-r">${p.r}</span>
      </a>`).join('') + `</div>`;
  } else {
    h = Object.keys(CATS).map(k => {
      const list = POSTS.filter(p => p.c === k);
      if (!list.length) return '';
      return `<section class="sec">
        <div class="sec-h">
          <span class="sec-d" style="background:var(${CATS[k].v})"></span>
          <h2 class="sec-n">${esc(CATS[k].n)}</h2>
          <span class="sec-c">${CATS[k].cnt}개</span>
        </div>
        <div class="list" style="border-top:none">` +
        list.map(p => `<a href="#" class="row" style="grid-template-columns:92px minmax(0,1fr) 116px 52px">
            <span class="row-d">2026.${p.d}</span>
            <span class="row-t">${esc(p.t)}</span>
            <span class="tags">${p.g.slice(0,1).map(g => `<span class="tag">#${esc(g)}</span>`).join('')}</span>
            <span class="row-r">${p.r}</span></a>`).join('') +
        `</div><a href="#" class="sec-more">전체 ${CATS[k].cnt}개 보기 →</a></section>`;
    }).join('');
  }
  el.innerHTML = h;
}

function setView(v, push) {
  document.querySelectorAll('.vt button').forEach(x =>
    x.setAttribute('aria-pressed', String(x.dataset.v === v)));
  render(v);
  try { localStorage.setItem('view', v); } catch (e) {}
  if (push) {
    const u = new URL(location.href);
    u.searchParams.set('view', v);
    history.replaceState(null, '', u);
  }
}
document.querySelectorAll('.vt button').forEach(b => {
  b.addEventListener('click', () => setView(b.dataset.v, true));
});

function setTheme(t) {
  document.documentElement.dataset.theme = t;
  document.getElementById('ico-sun').style.display = t === 'dark' ? 'none' : '';
  document.getElementById('ico-moon').style.display = t === 'dark' ? '' : 'none';
  try { localStorage.setItem('theme', t); } catch (e) {}
}
document.getElementById('theme').addEventListener('click', () => {
  setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
});

const q = new URLSearchParams(location.search);
let stored = null, storedTheme = null;
try { stored = localStorage.getItem('view'); storedTheme = localStorage.getItem('theme'); } catch (e) {}
const initView = ['card', 'list', 'cat'].includes(q.get('view')) ? q.get('view') : (stored || 'card');
const initTheme = "dark";
setTheme(initTheme);
setView(initView, false);
</script>
</body>
</html>
